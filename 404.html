<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Gold vs Bitcoin War Room</title>
<!--
  GitHub Pages SPA fallback (rafgraph/spa-github-pages pattern).
  GitHub Pages has no server-side route rewriting, so any deep link or refresh
  on a sub-path (e.g. /asset/btc) hits this 404 page. We encode the requested
  path into a query string and redirect to the repo root, where index.html
  decodes it back into a real path. pathSegmentsToKeep=1 keeps /<repo-name>/.
-->
<script type="text/javascript">
  var pathSegmentsToKeep = 1;
  var l = window.location;
  l.replace(
    l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
    l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
    l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
    (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
    l.hash
  );
</script>
</head>
<body>
  Redirecting to the War Room…
</body>
</html>
